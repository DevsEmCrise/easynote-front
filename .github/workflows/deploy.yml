name: Deploy Frontend + ECR

on:
  push:
    branches: [ master, Testando-pipeline ]
  workflow_dispatch:

env:
  AWS_REGION: sa-east-1
  ACCOUNT_ID: "853611856302"
  FRONT_REPO: front
  TAG: ${{ github.run_number }}-${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        run: docker build -t "${{ steps.ecr-login.outputs.registry }}/$FRONT_REPO:$TAG" .

      - name: Push
        run: docker push "${{ steps.ecr-login.outputs.registry }}/$FRONT_REPO:$TAG"

  deploy:
    name: Deploy na EC2 (frontend)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Gravar chave SSH
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Deploy na EC2 (frontend)
        env:
          ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          FRONT_REPO: ${{ env.FRONT_REPO }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          ECR_BASE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          FRONT_IMG="$ECR_BASE/$FRONT_REPO:$TAG"

          ssh -i "$GITHUB_WORKSPACE/key.pem" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              ubuntu@"${{ secrets.EC2_HOST }}" bash << EOF
          set -euo pipefail

          echo "==> Login no ECR"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_BASE"

          echo "==> Pull"
          docker pull "$FRONT_IMG"

          echo "==> Rede"
          docker network create easynote-net 2>/dev/null || true

          echo "==> Subindo frontend"
          docker rm -f easynote-frontend || true
          docker run -d --name easynote-frontend \
            --network easynote-net \
            --restart unless-stopped \
            -p 80:80 \
            "$FRONT_IMG"

          echo "==> Pronto!"
          docker ps --filter "name=easynote-frontend"
          EOF